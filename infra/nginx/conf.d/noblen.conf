# Noblen AI Platform reverse proxy.
# Routes /api and /docs to the backend; everything else to the Next.js frontend.
# In production, terminate TLS here (Let's Encrypt) and redirect 80 -> 443.

server {
    listen 80;
    server_name _;

    # Security headers (backend also sets its own; these cover static/frontend).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Backend API + OpenAPI docs + health.
    location /api/ {
        proxy_pass http://noblen_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://noblen_backend/health;
    }
    location = /readiness {
        proxy_pass http://noblen_backend/readiness;
    }
    location /docs {
        proxy_pass http://noblen_backend/docs;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://noblen_backend/openapi.json;
        proxy_set_header Host $host;
    }

    # Frontend (Next.js).
    location / {
        proxy_pass http://noblen_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
