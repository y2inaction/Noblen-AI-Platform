# Noblen AI Platform — production stack.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Production notes:
#  - Do NOT expose Postgres/Redis ports publicly; only the reverse proxy is public.
#  - Secrets come from the environment / .env (never committed).
#  - Deploy into an isolated directory (e.g. /opt/noblen-ai-platform) so it does
#    not interfere with other applications on the host.
name: noblen-ai-platform

services:
  postgres:
    restart: always
    ports: []          # not published to the host in production
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  redis:
    restart: always
    ports: []

  backend:
    restart: always
    ports: []          # reached only via the internal network / nginx
    environment:
      ENVIRONMENT: production
      DEBUG: "false"

  frontend:
    restart: always
    ports: []

  nginx:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      # Mount TLS certificates (e.g. Let's Encrypt) here in production:
      - ./infra/nginx/certs:/etc/nginx/certs:ro
